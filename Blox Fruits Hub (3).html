<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blox Fruits Hub</title>
<style>
:root{--bg:#f6f6fb;--card:#fff;--tx:#14141f;--mu:#6a6a80;--bd:#e5e5ef;--acc:#0ea5e9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d15;--card:#171722;--tx:#f1f1f8;--mu:#9a9ab2;--bd:#2a2a3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d15;--card:#171722;--tx:#f1f1f8;--mu:#9a9ab2;--bd:#2a2a3a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px}
.logo{font-weight:800;font-size:20px;display:flex;gap:10px;align-items:center}
.logo i{font-style:normal;background:var(--acc);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.pill{font-size:13px;color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:6px 12px;background:var(--card)}
.hero{border-radius:24px;padding:32px 22px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 26%,var(--card)),var(--card));border:1px solid var(--bd)}
.hero h1{font-size:clamp(28px,6vw,44px);line-height:1.1;margin:0 0 10px;letter-spacing:-.02em}
.hero p{color:var(--mu);margin:0 0 20px;max-width:520px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:14px;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px;margin-top:10px;background:transparent;color:var(--mu);border:1px solid var(--bd)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--acc)}
.stat span{font-size:12px;color:var(--mu)}
h2{font-size:18px;margin:26px 0 10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0;color:var(--mu);font-size:14px}
.lbl{font-size:12px;color:var(--acc);font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:3px 9px;margin-bottom:6px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.img{aspect-ratio:4/3;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:44px;overflow:hidden;margin-bottom:10px;border:1px solid var(--bd)}
.img img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
form{display:flex;gap:8px;flex-wrap:wrap}
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}.m{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:8px 12px;max-width:88%;align-self:flex-start;word-break:break-word}.m.me{align-self:flex-end;background:color-mix(in srgb,var(--acc) 18%,var(--card))}.m b{font-size:12px;color:var(--acc);display:block}.m small{color:var(--mu);font-size:11px}
.btn.sm.buy{background:var(--acc);color:#fff;border:0;text-decoration:none;display:inline-block;margin-right:8px}.buy.off{opacity:.55;cursor:default}
.fc{display:inline-block;border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px;color:#fff}
input,select{flex:1 1 150px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
.msg{margin:10px 0 0;font-size:14px;color:var(--acc);min-height:20px}
.rar{display:flex;gap:10px;align-items:flex-start}
.dot{width:12px;height:12px;border-radius:50%;margin-top:7px;flex:none}
#sw{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--tx);color:var(--bg);border:0;border-radius:99px;padding:14px 22px;font-weight:700;font-size:15px;box-shadow:0 8px 28px rgba(0,0,0,.28);cursor:pointer;max-width:92vw}
footer{text-align:center;color:var(--mu);font-size:13px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo"><i id="ic"></i><span id="nm"></span></div><div class="pill" id="pg"></div></header>
<main id="app"></main>
<footer>Situs penggemar, tidak berafiliasi dengan Roblox maupun Gamefam.</footer>
</div>
<button id="sw"></button>
<script>
var P={squad:{n:"Blox Squad",e:"🏴‍☠️",c:"#0ea5e9"},store:{n:"Blox Store",e:"🍎",c:"#f59e0b"},info:{n:"Blox Stock",e:"📦",c:"#a855f7"},chat:{n:"Blox Chat",e:"💬",c:"#22c55e"}};
var K=["squad","store","info","chat"],unsub=null,tick=null,GROUP="",PAY=["DANA","GoPay","OVO","ShopeePay","QRIS"],filter="all",items=null;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cur(){var h=location.hash.slice(1);return K.indexOf(h)>=0?h:"squad"}
function card(l,t,p){return '<div class="card"><div class="lbl">'+l+'</div><h3>'+t+'</h3><p>'+p+'</p></div>'}

function vSquad(){
var n=0;try{n=JSON.parse(localStorage.getItem("bf:join")||"[]").length}catch(e){}
return '<section class="hero"><h1>Gabung kru bajak laut kami</h1><p>Komunitas Blox Fruits untuk raid bareng, tukar tips, dan naik level bersama.</p><button class="btn" onclick="document.getElementById(\'u\').focus()">Gabung Sekarang</button></section>'+
'<h2>Info Gameplay-ku</h2><div class="stats"><div class="stat"><b>2550</b><span>Level</span></div><div class="stat"><b>Sea 3</b><span>Lokasi</span></div><div class="stat"><b>V4</b><span>Race</span></div></div>'+
'<div class="grid">'+card("Buah utama","Dough","Combo cepat, enak untuk raid dan PvP.")+card("Fighting style","Godhuman","Dipadukan dengan pedang untuk damage stabil.")+card("Jam main","Malam hari","Biasanya online jam 19.00 sampai 23.00 WIB.")+card("Fokus sekarang","Raid & Boss","Cari fragments dan latih Race.")+'</div>'+
'<h2>Jadwal Main Bareng</h2><div class="grid">'+card("Sabtu","Raid Bareng","Kumpul di Discord jam 20.00.")+card("Minggu","Farm Level","Bantu anggota baru naik level.")+'</div>'+
'<h2>Daftar Jadi Anggota</h2><div class="card"><form id="f"><input id="u" placeholder="Username Roblox" required><input id="d" placeholder="Discord (opsional)"><button class="btn" type="submit">Daftar</button></form><div class="msg" id="m">Pendaftar di perangkat ini: '+n+'</div></div>';
}
function bSquad(){document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var u=document.getElementById("u").value,l=[];
try{l=JSON.parse(localStorage.getItem("bf:join")||"[]");l.push({u:u,d:document.getElementById("d").value});localStorage.setItem("bf:join",JSON.stringify(l))}catch(e){}
document.getElementById("m").textContent="Selamat datang, "+u+"! Pendaftar: "+Math.max(l.length,1);ev.target.reset()}}

function buy(){return GROUP?'<a class="btn sm buy" href="'+GROUP+'" target="_blank" rel="noopener noreferrer">Beli · DM Admin</a>':'<span class="btn sm buy off">Link grup segera hadir</span>'}
function load(){try{var s=localStorage.getItem("bf:items");if(s)return JSON.parse(s)}catch(e){}
return [{id:1,nama:"Dough Fruit",jenis:"Buah",harga:50000,stok:2,foto:"",emo:"🍩"},{id:2,nama:"Kitsune Fruit",jenis:"Buah",harga:75000,stok:1,foto:"",emo:"🦊"},{id:3,nama:"Akun Lv 2550 Sea 3",jenis:"Akun",harga:150000,stok:1,foto:"",emo:"👤"}]}
function save(){try{localStorage.setItem("bf:items",JSON.stringify(items))}catch(e){alert("Foto terlalu besar untuk disimpan, coba foto lain.")}}
function shrink(f,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.75))};im.src=r.result};r.readAsDataURL(f)}
function setF(f){filter=f;render()}
function del(id){items=items.filter(function(x){return x.id!==id});save();render()}
function vStore(){
if(!items)items=load();
var list=items.filter(function(x){return filter==="all"||x.jenis===filter});
var chips=[["all","Semua"],["Buah","Buah"],["Akun","Akun"]].map(function(c){return '<button class="chip'+(filter===c[0]?' on':'')+'" onclick="setF(\''+c[0]+'\')">'+c[1]+'</button>'}).join("");
return '<section class="hero"><h1>Stok buah &amp; akun</h1><p>Pilih item yang kamu mau, lalu DM admin lewat grup untuk beli. Semua transaksi diatur langsung oleh admin.</p>'+buy()+'</section>'+
'<h2>Stok Tersedia</h2><div class="chips">'+chips+'</div><div class="grid">'+(list.length?list.map(function(x){
return '<div class="card"><div class="img">'+(x.foto?'<img alt="" src="'+x.foto+'">':(x.emo||"🍎"))+'</div><span class="badge">'+esc(x.jenis)+(x.stok<1?' · Habis':'')+'</span><h3>'+esc(x.nama)+'</h3><p>Rp '+Number(x.harga).toLocaleString("id-ID")+' · stok '+x.stok+'</p>'+buy()+'<button class="btn sm" onclick="del('+x.id+')">Hapus</button></div>'}).join(""):'<div class="card"><p>Belum ada item.</p></div>')+'</div>'+
'<h2>Cara Beli</h2><div class="grid">'+card("Langkah 1","Pilih item","Lihat stok di atas dan catat nama item yang kamu mau.")+card("Langkah 2","Masuk grup","Tekan tombol Beli · DM Admin untuk membuka grup.")+card("Langkah 3","DM admin","Kirim nama item dan username Roblox kamu ke admin.")+card("Langkah 4","Ikuti arahan","Admin akan memandu proses selanjutnya lewat DM.")+'</div>'+
'<h2>Metode Pembayaran</h2><div class="card"><div class="lbl">Berlaku untuk buah &amp; akun</div><div class="chips">'+PAY.map(function(p){return '<span class="fc" style="background:var(--acc)">'+p+'</span>'}).join("")+'</div><p>Nomor atau QR pembayaran dikirim admin lewat DM setelah kamu memilih item. Jangan transfer ke nomor lain, dan kirim barang hanya setelah admin mengonfirmasi.</p></div>'+
'<h2>Tambah Stok</h2><div class="card"><form id="g"><input id="sn" placeholder="Nama item" required><select id="sj"><option>Buah</option><option>Akun</option></select><input id="sh" type="number" min="0" placeholder="Harga (Rp)" required><input id="ss" type="number" min="0" placeholder="Stok" value="1" required><input id="sf" type="file" accept="image/*"><button class="btn" type="submit">Simpan</button></form></div>';
}
function bStore(){document.getElementById("g").onsubmit=function(ev){ev.preventDefault();
var add=function(foto){items.push({id:Date.now(),nama:document.getElementById("sn").value,jenis:document.getElementById("sj").value,harga:+document.getElementById("sh").value,stok:+document.getElementById("ss").value,foto:foto||"",emo:"🍎"});save();render()};
var f=document.getElementById("sf").files[0];if(f)shrink(f,add);else add("")}}

var FR={};[["#9ca3af","Rocket Spin Blade Spring Bomb Smoke Spike"],["#22c55e","Flame Ice Sand Dark Eagle Diamond"],["#3b82f6","Light Rubber Ghost Magma"],["#a855f7","Quake Buddha Love Spider Sound Phoenix Portal Rumble Pain Blizzard"],["#ef4444","Gravity Mammoth T-Rex Dough Shadow Venom Control Spirit Dragon Leopard Kitsune"]].forEach(function(r){r[1].split(" ").forEach(function(n){FR[n.toLowerCase()]=r[0]})});
var SK=[["normal","Dealer Normal",4],["mirage","Dealer Mirage",2]],SD={};
function vStock(){
return '<section class="hero"><h1>Stock Blox Fruits</h1><p>Info stok dealer setiap restock. Dealer Normal restock tiap 4 jam, Dealer Mirage tiap 2 jam.</p></section>'+SK.map(function(k){return '<h2>'+k[1]+'</h2><div class="card"><div class="lbl">Restock tiap '+k[2]+' jam</div><div class="chips" id="f-'+k[0]+'"><span class="msg">Memuat…</span></div><p class="msg" id="t-'+k[0]+'"></p><div id="a-'+k[0]+'"></div></div>'}).join("")+'<p class="msg">Stok diperbarui admin setiap restock. Waktu restock berikutnya dihitung dari waktu pembaruan terakhir.</p>';
}
function drawS(k){var d=SD[k[0]],f=document.getElementById("f-"+k[0]);if(!f)return;f.textContent="";
if(!d||!d.fruits||!d.fruits.length){var e=document.createElement("span");e.className="msg";e.textContent="Belum ada info stok.";f.appendChild(e);return}
d.fruits.forEach(function(n){var c=document.createElement("span");c.className="fc";c.style.background=FR[String(n).toLowerCase()]||"#6b7280";c.textContent=n;f.appendChild(c)})}
function drawT(){SK.forEach(function(k){var d=SD[k[0]],t=document.getElementById("t-"+k[0]);if(!t)return;if(!d||!d.t){t.textContent="";return}
var left=d.t+k[2]*36e5-Date.now(),up=new Date(d.t).toLocaleString("id-ID",{weekday:"short",hour:"2-digit",minute:"2-digit"});
if(left>0){var h=Math.floor(left/36e5),m=Math.floor(left%36e5/6e4),sc=Math.floor(left%6e4/1e3);t.textContent="Diperbarui "+up+" · perkiraan restock lagi "+h+"j "+m+"m "+sc+"d"}
else t.textContent="Diperbarui "+up+" · waktu restock sudah lewat, menunggu pembaruan admin."})}
async function bStock(){
var c=null,u=null;try{if(window.claude){c=await claude.use("db");u=await claude.use("user")}}catch(e){}
if(cur()!=="info")return;
if(!c){SK.forEach(function(k){document.getElementById("f-"+k[0]).innerHTML='<span class="msg">Masuk ke claude.ai untuk melihat stok terbaru.</span>'});return}
var admin=!!(u&&((u.canEdit&&u.canEdit())||(u.isOwner&&u.isOwner())));
var us=[];
SK.forEach(function(k){
us.push(c.doc("stock/"+k[0]).onSnapshot(function(s){SD[k[0]]=s.exists?s.data():null;drawS(k);drawT()},function(){document.getElementById("f-"+k[0]).innerHTML='<span class="msg">Stok belum bisa dimuat.</span>'}));
if(admin){var a=document.getElementById("a-"+k[0]);
a.innerHTML='<form style="margin-top:10px"><input placeholder="Buah, pisahkan koma (Dough, Kitsune)" required><button class="btn" type="submit">Simpan stok</button></form><div class="msg"></div>';
a.firstChild.onsubmit=function(ev){ev.preventDefault();var inp=a.querySelector("input"),ms=a.querySelector(".msg");
var arr=inp.value.split(/[,\n]/).map(function(x){return x.trim()}).filter(Boolean).slice(0,12);
c.doc("stock/"+k[0]).set({fruits:arr,t:Date.now()}).then(function(){inp.value="";ms.textContent="Tersimpan."}).catch(function(){ms.textContent="Gagal menyimpan."})}}
});
unsub=function(){us.forEach(function(f){f()})};
tick=setInterval(drawT,1000)}

function wk(){var d=new Date(Date.now()+252e5),n=(d.getUTCDay()+6)%7;return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-n))}
function wkKey(o){return "w"+new Date(wk().getTime()+o*6048e5).toISOString().slice(0,10).replace(/-/g,"")}
function vChat(){
return '<section class="hero"><h1>Ngobrol bareng komunitas</h1><p>Obrolan direset otomatis setiap Senin pukul 00.00 WIB. Reset berikutnya: <b id="rs"></b>.</p></section><h2>Obrolan Minggu Ini</h2><div class="card"><div class="chat" id="cm"><p class="msg">Memuat obrolan…</p></div><form id="cf" style="margin-top:12px"><input id="cn" placeholder="Nama / username Roblox" required maxlength="24"><input id="ct" placeholder="Tulis pesan…" required maxlength="300"><button class="btn" type="submit">Kirim</button></form><div class="msg" id="cs"></div></div>';
}
async function bChat(){
var st=document.getElementById("cs"),box=document.getElementById("cm"),nm=document.getElementById("cn"),tx=document.getElementById("ct");
var nx=new Date(wk().getTime()+6048e5);
document.getElementById("rs").textContent="Senin, "+nx.toLocaleDateString("id-ID",{day:"numeric",month:"long",timeZone:"UTC"})+" ("+Math.max(1,Math.ceil((nx.getTime()-252e5-Date.now())/864e5))+" hari lagi)";
try{nm.value=localStorage.getItem("bf:nick")||""}catch(e){}
var c=null,u=null,uid="";
try{if(window.claude){c=await claude.use("db");u=await claude.use("user");if(u&&u.id)uid=String(await u.id()||"")}}catch(e){}
if(cur()!=="chat")return;
if(!c){box.innerHTML='<p class="msg">Chat butuh akun Claude. Buka halaman ini lewat claude.ai dan masuk dulu.</p>';return}
var col=c.collection("chat/"+wkKey(0)+"/messages");
var timer=setTimeout(function(){st.textContent="Obrolan belum bisa dimuat, cek koneksimu."},10000);
unsub=col.orderBy("t","asc").limit(300).onSnapshot(function(s){
clearTimeout(timer);st.textContent="";box.textContent="";
if(s.empty){var e=document.createElement("p");e.className="msg";e.textContent="Belum ada pesan minggu ini. Jadi yang pertama!";box.appendChild(e)}
s.docs.forEach(function(d){var x=d.data()||{},m=document.createElement("div"),b=document.createElement("b"),t=document.createElement("div"),sm=document.createElement("small");
m.className="m"+(uid&&x.uid===uid?" me":"");b.textContent=x.n||"Anon";t.textContent=x.m||"";
sm.textContent=new Date(x.t||0).toLocaleString("id-ID",{weekday:"short",hour:"2-digit",minute:"2-digit"});
m.appendChild(b);m.appendChild(t);m.appendChild(sm);box.appendChild(m)});
box.scrollTop=box.scrollHeight},function(){clearTimeout(timer);st.textContent="Tidak bisa memuat chat."});
if(u&&u.isOwner&&u.isOwner()){[-1,-2,-3].forEach(function(o){var oc=c.collection("chat/"+wkKey(o)+"/messages");oc.get().then(function(q){q.docs.forEach(function(d){oc.doc(d.id).delete().catch(function(){})})}).catch(function(){})})}
document.getElementById("cf").onsubmit=async function(ev){ev.preventDefault();
try{localStorage.setItem("bf:nick",nm.value)}catch(e){}
var v=tx.value;st.textContent="Mengirim…";
try{await col.add({n:nm.value,m:v,t:Date.now(),uid:uid});tx.value="";st.textContent=""}
catch(e){st.textContent="Pesan gagal terkirim. Kemungkinan akunmu hanya boleh membaca obrolan ini."}}
}

function render(){
if(unsub){unsub();unsub=null}
if(tick){clearInterval(tick);tick=null}
var id=cur(),d=P[id],i=K.indexOf(id),nx=K[(i+1)%K.length];
document.documentElement.style.setProperty("--acc",d.c);
document.title=d.n;
document.getElementById("ic").textContent=d.e;
document.getElementById("nm").textContent=d.n;
document.getElementById("pg").textContent="Web "+(i+1)+" dari 4";
document.getElementById("app").innerHTML=id==="squad"?vSquad():id==="store"?vStore():id==="info"?vStock():vChat();
if(id==="squad")bSquad();if(id==="store")bStore();if(id==="chat")bChat();if(id==="info")bStock();
var b=document.getElementById("sw");b.textContent="Pindah ke "+P[nx].n+" "+P[nx].e+" →";b.onclick=function(){location.hash=nx;window.scrollTo(0,0)}
}
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
